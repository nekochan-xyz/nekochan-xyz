<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Ayarları - Xforum</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 20px; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 20px; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
        .section h3 { font-size: 15px; color: #e2e8f0; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 10px; background-color: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background-color: #0369a1; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        .info-text { font-size: 14px; color: #cbd5e1; line-height: 1.4; }
        .msg { font-size: 13px; text-align: center; min-height: 18px; }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
        .back-home { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 13px; margin-top: 5px; }
        .back-home:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hesap Ayarları</h2>
        
        <!-- Hesap Bilgileri -->
        <div class="section">
            <h3>Hesap Bilgileri</h3>
            <p class="info-text">Kullanıcı Adı: <strong id="currentUsername">Yükleniyor...</strong></p>
            <p class="info-text">Oluşturulma Tarihi: <strong id="accountCreated">Yükleniyor...</strong></p>
        </div>

        <!-- Kullanıcı Adı Değiştirme -->
        <div class="section">
            <h3>Kullanıcı Adını Değiştir</h3>
            <input type="text" id="newUsername" placeholder="Yeni Kullanıcı Adı">
            <button onclick="changeUsername()">Kullanıcı Adını Değiştir</button>
            <p id="usernameMsg" class="msg"></p>
        </div>

        <!-- Şifre Değiştirme -->
        <div class="section">
            <h3>Şifre Değiştir</h3>
            <input type="password" id="currentPassword" placeholder="Mevcut Şifre">
            <input type="password" id="newPassword" placeholder="Yeni Şifre">
            <input type="password" id="confirmNewPassword" placeholder="Yeni Şifre (Tekrar)">
            <button onclick="changePassword()">Şifreyi Değiştir</button>
            <p id="passwordMsg" class="msg"></p>
        </div>

        <!-- Hesabı Sil -->
        <div class="section" style="border-color: #7f1d1d;">
            <h3 style="color: #ef4444;">Hesabı Sil</h3>
            <input type="password" id="deletePassword" placeholder="Hesap Şifreniz">
            <button class="btn-danger" onclick="deleteAccount()">Hesabımı Kalıcı Olarak Sil</button>
            <p id="deleteMsg" class="msg"></p>
        </div>

        <a href="../index.html" class="back-home">← Ana Sayfaya Dön</a>
    </div>

    <script type="module">
        import { auth, db } from '../firebase-config.js';
        import { onAuthStateChanged, updatePassword, signInWithEmailAndPassword, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUser = null;
        let activeUsername = "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert("Lütfen önce giriş yapın.");
                window.location.href = "../login/index.html";
                return;
            }
            if (user.isAnonymous) {
                alert("Misafir hesaplarında hesap ayarları yapılamaz.");
                window.location.href = "../index.html";
                return;
            }

            currentUser = user;
            
            const creationTime = user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleString('tr-TR') : "Bilinmiyor";
            document.getElementById('accountCreated').textContent = creationTime;

            activeUsername = user.email ? user.email.split('@')[0] : "Kullanıcı";
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().username) {
                    activeUsername = userDoc.data().username;
                }
            } catch (e) {
                console.warn("Firestore okuma uyarısı:", e);
            }
            document.getElementById('currentUsername').textContent = activeUsername;
            document.getElementById('newUsername').value = activeUsername;
        });

        window.changeUsername = async () => {
            const msgEl = document.getElementById('usernameMsg');
            msgEl.textContent = "";
            msgEl.className = "msg";

            const newName = document.getElementById('newUsername').value.trim();
            const validRegex = /^[a-zA-Z0-9çğıöşüÇĞİÖŞÜ_\-\.]+$/;
            
            if (!validRegex.test(newName)) {
                msgEl.textContent = "Kullanıcı adında boşluk, @ ve özel karakterler olamaz!";
                msgEl.classList.add("error");
                return;
            }

            if (newName.toLowerCase() === activeUsername.toLowerCase()) {
                msgEl.textContent = "Zaten bu kullanıcı adını kullanıyorsunuz.";
                msgEl.classList.add("error");
                return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", newName));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    msgEl.textContent = "Bu kullanıcı adı zaten kullanımda! Başka bir ad seçin.";
                    msgEl.classList.add("error");
                    return;
                }

                await setDoc(doc(db, "users", currentUser.uid), {
                    username: newName,
                    email: currentUser.email,
                    updatedAt: new Date().toISOString()
                }, { merge: true });

                activeUsername = newName;
                document.getElementById('currentUsername').textContent = newName;
                msgEl.textContent = "Kullanıcı adı başarıyla değiştirildi!";
                msgEl.classList.add("success");
            } catch (error) {
                console.error("Kullanıcı adı değiştirme hatası:", error);
                msgEl.textContent = "Hata: " + error.message;
                msgEl.classList.add("error");
            }
        };

        window.changePassword = async () => {
            const msgEl = document.getElementById('passwordMsg');
            msgEl.textContent = "";
            msgEl.className = "msg";

            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;

            if (!currentPass || !newPass || !confirmPass) {
                msgEl.textContent = "Lütfen tüm şifre alanlarını doldurun.";
                msgEl.classList.add("error");
                return;
            }

            if (newPass !== confirmPass) {
                msgEl.textContent = "Yeni şifreler eşleşmiyor!";
                msgEl.classList.add("error");
                return;
            }

            if (newPass.length < 6) {
                msgEl.textContent = "Yeni şifre en az 6 karakter olmalıdır.";
                msgEl.classList.add("error");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, currentUser.email, currentPass);
                await updatePassword(currentUser, newPass);

                msgEl.textContent = "Şifre başarıyla değiştirildi!";
                msgEl.classList.add("success");
                document.getElementById('currentPassword').value = "";
                document.getElementById('newPassword').value = "";
                document.getElementById('confirmNewPassword').value = "";
            } catch (error) {
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msgEl.textContent = "Mevcut şifre hatalı!";
                } else {
                    msgEl.textContent = "Hata: " + error.message;
                }
                msgEl.classList.add("error");
            }
        };

        window.deleteAccount = async () => {
            const msgEl = document.getElementById('deleteMsg');
            msgEl.textContent = "";
            msgEl.className = "msg";

            const password = document.getElementById('deletePassword').value;
            if (!password) {
                msgEl.textContent = "Hesabınızı silmek için şifrenizi girmelisiniz.";
                msgEl.classList.add("error");
                return;
            }

            if (!confirm("Hesabınızı kalıcı olarak silmek istediğinize emin misiniz? Bu işlem geri alınamaz!")) {
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, currentUser.email, password);
                
                try {
                    await deleteDoc(doc(db, "users", currentUser.uid));
                } catch(e) {
                    console.warn("Firestore kullanıcı kaydı silinemedi:", e);
                }

                await deleteUser(currentUser);
                alert("Hesabınız başarıyla silindi.");
                window.location.href = "../index.html";
            } catch (error) {
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msgEl.textContent = "Girilen şifre hatalı!";
                } else {
                    msgEl.textContent = "Hata: " + error.message;
                }
                msgEl.classList.add("error");
            }
        };
    </script>
</body>
</html>
