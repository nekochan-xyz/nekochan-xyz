<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topluluk Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div id="guestNav">
            <a href="login/" class="btn btn-secondary">Giriş Yap</a>
            <a href="register/" class="btn">Kayıt Ol</a>
        </div>
        <div id="userNav" class="hidden" style="display: flex; align-items: center; gap: 12px;">
            <span id="welcomeUser" style="font-size: 0.9rem; color: #58a6ff; font-weight: bold;"></span>
            <button id="logoutBtn" class="btn-danger">Çıkış Yap</button>
        </div>
    </header>

    <div class="container">
        <div id="loginPrompt" class="box" style="text-align: center;">
            <p style="color: #8b949e; margin-bottom: 0.8rem;">Yeni konu paylaşabilmek için giriş yapmalısınız.</p>
            <a href="login/" class="btn btn-secondary">Giriş Yap veya Kayıt Ol</a>
        </div>

        <div id="newPostBox" class="box hidden">
            <h3 style="margin-bottom: 0.8rem; font-size: 1.1rem;">Yeni Konu Başlat</h3>
            <input type="text" id="postTitle" placeholder="Konu başlığını buraya yazın...">
            <textarea id="postContent" rows="3" placeholder="Mesajınızı veya sorunuzu yazın..."></textarea>
            <button id="publishBtn">Konuyu Yayınla</button>
        </div>

        <div id="postsList">
            <p style="color: #8b949e; text-align: center;">Konular yükleniyor...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUser = null;

        // Oturum Kontrolü (Firebase dijital bileti otomatik kontrol eder)
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('guestNav').classList.add('hidden');
                document.getElementById('userNav').classList.remove('hidden');
                document.getElementById('welcomeUser').innerText = '@' + (user.displayName || 'Üye');
                document.getElementById('newPostBox').classList.remove('hidden');
                document.getElementById('loginPrompt').classList.add('hidden');
            } else {
                document.getElementById('guestNav').classList.remove('hidden');
                document.getElementById('userNav').classList.add('hidden');
                document.getElementById('newPostBox').classList.add('hidden');
                document.getElementById('loginPrompt').classList.remove('hidden');
            }
        });

        // Çıkış Yapma
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // Konu Paylaşma
        document.getElementById('publishBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                alert("Lütfen başlık ve içerik alanlarını doldurun.");
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    author: currentUser.displayName || 'Üye',
                    createdAt: serverTimestamp()
                });
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
            } catch (e) {
                alert("Paylaşım hatası: " + e.message);
            }
        });

        // Konuları Canlı Dinleme (Herkes birbirinin konusunu anında görür)
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const postsList = document.getElementById('postsList');
            let html = '';

            snapshot.forEach((doc) => {
                const post = doc.data();
                const dateStr = post.createdAt ? post.createdAt.toDate().toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : 'Az önce';
                html += `
                    <div class="post-card">
                        <div class="post-title">${escapeHTML(post.title)}</div>
                        <div class="post-meta">@${escapeHTML(post.author)} • ${dateStr}</div>
                        <p>${escapeHTML(post.content)}</p>
                    </div>
                `;
            });

            if (html === '') {
                html = '<div class="post-card"><p style="color:#8b949e;">Henüz konu açılmamış. İlk konuyu sen başlat!</p></div>';
            }
            postsList.innerHTML = html;
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
