<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xforum - Tartışma Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Üst Bilgi ve Navigasyon -->
        <header class="header">
            <div class="logo">Xforum</div>
            <div class="user-menu" id="userMenu">
                <!-- Giriş Yapılmamış Durum -->
                <div id="authButtons" class="auth-buttons">
                    <button class="btn btn-outline" onclick="location.href='login/'">Giriş Yap</button>
                    <button class="btn btn-primary" onclick="location.href='reister/'">Kayıt Ol</button>
                    <button class="btn btn-secondary" onclick="loginAnonymously()">Misafir</button>
                </div>
                <!-- Giriş Yapılmış Durum -->
                <div id="accountInfo" class="account-info" style="display: none;">
                    <span id="usernameDisplay">Kullanıcı</span>
                    <button class="btn btn-outline btn-sm" onclick="toggleAccountSettings()">Hesap Ayarları</button>
                </div>
            </div>
        </header>

        <!-- Hesap Ayarları Paneli (Gizli/Açılır) -->
        <div id="accountSettingsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Hesap Ayarları</h3>
                    <button class="close-btn" onclick="toggleAccountSettings()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-group">
                        <label>Kullanıcı Adı Değiştir</label>
                        <input type="text" id="newUsername" placeholder="Yeni kullanıcı adı">
                        <button class="btn btn-primary btn-sm" onclick="updateUsername()">Güncelle</button>
                    </div>
                    <div class="setting-group">
                        <label>Şifre Değiştir</label>
                        <input type="password" id="currentPassword" placeholder="Mevcut şifre">
                        <input type="password" id="newPassword" placeholder="Yeni şifre (en az 8 karakter)">
                        <button class="btn btn-primary btn-sm" onclick="updatePassword()">Şifreyi Değiştir</button>
                    </div>
                    <div class="setting-group danger-zone">
                        <button class="btn btn-danger btn-sm" onclick="deleteAccount()">Hesabı Sil</button>
                        <button class="btn btn-secondary btn-sm" onclick="logout()">Çıkış Yap</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Yeni Konu Başlat Alanı -->
        <section class="create-post-section">
            <h2>Yeni Konu Başlat</h2>
            <form id="postForm" onsubmit="createPost(event)">
                <input type="text" id="postTitle" placeholder="Konu başlığını buraya yazın..." required>
                <textarea id="postContent" placeholder="Ne düşünüyorsun veya sorununu yazın..." rows="4" required></textarea>
                <button type="submit" class="btn btn-success">Konuyu Yayınla</button>
            </form>
        </section>

        <!-- Konu Listesi -->
        <section class="posts-section">
            <h2>Xforum'a Hoş Geldiniz!</h2>
            <div id="postsContainer">
                <p class="loading-text">Konular yükleniyor...</p>
            </div>
        </section>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.loginAnonymously = async () => {
            try {
                await signInAnonymously(auth);
                alert("Misafir olarak giriş yapıldı!");
            } catch (error) {
                console.error("Giriş hatası:", error);
            }
        };

        window.logout = async () => {
            await signOut(auth);
            location.reload();
        };

        window.toggleAccountSettings = () => {
            const modal = document.getElementById('accountSettingsModal');
            modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
        };

        onAuthStateChanged(auth, (user) => {
            const authButtons = document.getElementById('authButtons');
            const accountInfo = document.getElementById('accountInfo');
            const usernameDisplay = document.getElementById('usernameDisplay');

            if (user) {
                authButtons.style.display = 'none';
                accountInfo.style.display = 'flex';
                usernameDisplay.textContent = user.isAnonymous ? "Misafir Kullanıcı" : (user.email || "Kullanıcı");
            } else {
                authButtons.style.display = 'flex';
                accountInfo.style.display = 'none';
            }
        });

        window.createPost = async (e) => {
            e.preventDefault();
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const user = auth.currentUser;

            if (!user) {
                alert("Konu yayınlamak için lütfen giriş yapın veya misafir olarak bağlanın.");
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    author: user.isAnonymous ? "Misafir" : (user.email || "Kullanıcı"),
                    createdAt: serverTimestamp()
                });
                document.getElementById('postForm').reset();
                loadPosts();
            } catch (error) {
                console.error("Konu eklenirken hata oluştu:", error);
                alert("Hata: " + error.message);
            }
        };

        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = "<p>Yükleniyor...</p>";

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p class='no-posts'>Henüz hiç konu açılmamış. İlk konuyu sen başlat!</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    const postElement = document.createElement('div');
                    postElement.className = 'post-card';
                    postElement.innerHTML = `
                        <h3>${escapeHtml(post.title)}</h3>
                        <p>${escapeHtml(post.content)}</p>
                        <div class="post-meta">Yayınlayan: <strong>${escapeHtml(post.author || 'Anonim')}</strong></div>
                    `;
                    container.appendChild(postElement);
                });
            } catch (error) {
                console.error("Konular yüklenemedi:", error);
                container.innerHTML = "<p>Konular yüklenirken bir hata oluştu.</p>";
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        loadPosts();
    </script>
</body>
</html>
