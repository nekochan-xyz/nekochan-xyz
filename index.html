<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa - Hoş Geldiniz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; }
        p { color: #666; margin-bottom: 20px; }
        button { padding: 10px 20px; background-color: #ff4d4d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hoş Geldiniz!</h2>
        <p id="userInfo">Kullanıcı bilgileri yükleniyor...</p>
        <button id="logoutBtn">Çıkış Yap</button>
    </div>

    <script type="module">
        import { auth } from '../firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

        const userInfo = document.getElementById('userInfo');
        const logoutBtn = document.getElementById('logoutBtn');

        // Oturum durumunu kontrol et
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Kullanıcı giriş yapmış
                userInfo.textContent = `Giriş yapan e-posta: ${user.email}`;
            } else {
                // Giriş yapılmamışsa login sayfasına at
                window.location.href = "../login/index.html";
            }
        });

        // Çıkış yap butonu
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = "../login/index.html";
            } catch (error) {
                alert("Çıkış yapılırken bir hata oluştu: " + error.message);
            }
        });
    </script>
</body>
</html>
