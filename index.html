<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xforum - Tartışma Platformu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .post-card {
            position: relative;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }
        .post-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }
        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
        }
        .delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .root-badge {
            background: #dc2626;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Üst Bilgi ve Hamburger Menü -->
        <header class="header">
            <a href="index.html" class="logo">Xforum</a>
            <div class="menu-container">
                <span id="usernameDisplay" style="font-size: 14px; color: #38bdf8; font-weight: 600;"></span>
                <button class="hamburger-btn" onclick="toggleMenu()">&#9776;</button>
                <div id="dropdownMenu" class="dropdown-content">
                    <!-- JavaScript ile dinamik dolacak -->
                </div>
            </div>
        </header>

        <!-- Yeni Konu Başlat Alanı -->
        <section class="create-post-section">
            <h2>Yeni Konu Başlat</h2>
            <form id="postForm" onsubmit="createPost(event)">
                <input type="text" id="postTitle" placeholder="Konu başlığını buraya yazın..." required>
                <textarea id="postContent" placeholder="Ne düşünüyorsun veya sorununu yazın..." rows="4" required></textarea>
                <button type="submit" class="btn btn-success">Konuyu Yayınla</button>
            </form>
        </section>

        <!-- Konu Listesi -->
        <section class="posts-section">
            <h2>Xforum'a Hoş Geldiniz!</h2>
            <div id="postsContainer">
                <p class="loading-text">Konular yükleniyor...</p>
            </div>
        </section>
    </div>

    <!-- Firebase ve Uygulama Mantığı (10.12.2 Uyumlu) -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, addDoc, getDocs, query, orderBy, getDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const ROOT_UIDS = [
            "ToemJGBIU9XH7RWZ90SQqjWk0AH3",
            "toemJGBIU9XH7RWZ90SQqjWk0AH3",
            "XfWiKbssLzWUHJMINIIrEjVvLja2"
        ];
        const PENCIL_SVG = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
        const TRASH_SVG = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4h-3.5z"/></svg>`;

        let isRootUser = false;

        window.toggleMenu = () => {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        };

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        window.logout = async () => {
            try {
                await signOut(auth);
                alert("Çıkış yapıldı.");
                location.reload();
            } catch (error) {
                console.error("Çıkış hatası:", error);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const dropdownMenu = document.getElementById('dropdownMenu');
            const usernameDisplay = document.getElementById('usernameDisplay');
            dropdownMenu.innerHTML = '';
            isRootUser = false;

            if (user) {
                let displayName = "Kullanıcı";
                if (user.isAnonymous) {
                    displayName = "Misafir Kullanıcı";
                } else {
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists() && userDoc.data().username) {
                            displayName = userDoc.data().username;
                        } else {
                            displayName = user.email.split('@')[0];
                        }
                    } catch (e) {
                        displayName = user.email.split('@')[0];
                    }

                    if (ROOT_UIDS.includes(user.uid)) {
                        isRootUser = true;
                    }
                }

                usernameDisplay.innerHTML = isRootUser 
                    ? `${escapeHtml(displayName)} <span class="root-badge">ROOT</span>` 
                    : escapeHtml(displayName);
                
                if (user.isAnonymous) {
                    dropdownMenu.innerHTML = `
                        <button onclick="logout()">Çıkış Yap</button>
                    `;
                } else {
                    const rootMenuLink = isRootUser ? `<a href="asd/index.html">Root Paneli</a>` : '';
                    dropdownMenu.innerHTML = `
                        ${rootMenuLink}
                        <a href="setacc/index.html">Hesap Ayarları</a>
                        <button onclick="logout()">Çıkış Yap</button>
                    `;
                }
            } else {
                usernameDisplay.textContent = "";
                dropdownMenu.innerHTML = `
                    <a href="login/index.html">Giriş Yap</a>
                    <a href="register/index.html">Kayıt Ol</a>
                    <a href="guestacc/index.html">Misafir</a>
                `;
            }
            loadPosts();
        });

        window.createPost = async (e) => {
            e.preventDefault();
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const user = auth.currentUser;

            if (!user) {
                alert("Konu yayınlamak için lütfen giriş yapın veya misafir olarak bağlanın.");
                return;
            }

            let authorName = "Kullanıcı";
            if (user.isAnonymous) {
                authorName = "Misafir";
            } else {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        if (userDoc.data().banned === true) {
                            alert("Hesabınız yönetici tarafından engellendiği için yeni konu açamazsınız.");
                            return;
                        }
                        if (userDoc.data().username) {
                            authorName = userDoc.data().username;
                        } else {
                            authorName = user.email.split('@')[0];
                        }
                    } else {
                        authorName = user.email.split('@')[0];
                    }
                } catch (e) {
                    authorName = user.email.split('@')[0];
                }
            }

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    author: authorName,
                    userId: user.uid,
                    createdAt: new Date().toISOString()
                });
                document.getElementById('postForm').reset();
                loadPosts();
            } catch (error) {
                console.error("Konu eklenirken hata oluştu:", error);
                alert("Hata: Konu yayınlama izniniz yok veya bir hata oluştu.");
            }
        };

        window.deletePost = async (postId) => {
            if (!confirm("Bu konuyu silmek istediğinize emin misiniz?")) return;
            try {
                await deleteDoc(doc(db, "posts", postId));
                loadPosts();
            } catch (error) {
                console.error("Silme hatası:", error);
                alert("Konu silinemedi: " + error.message);
            }
        };

        window.editPost = async (postId, oldTitle, oldContent) => {
            const newTitle = prompt("Yeni başlığı girin:", oldTitle);
            if (newTitle === null) return;
            
            const newContent = prompt("Yeni içeriği girin:", oldContent);
            if (newContent === null) return;

            if (!newTitle.trim() || !newContent.trim()) {
                alert("Başlık ve içerik boş bırakılamaz!");
                return;
            }

            try {
                await updateDoc(doc(db, "posts", postId), {
                    title: newTitle,
                    content: newContent,
                    updatedAt: new Date().toISOString()
                });
                loadPosts();
            } catch (error) {
                console.error("Düzenleme hatası:", error);
                alert("Konu güncellenemedi: " + error.message);
            }
        };

        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = "<p class='loading-text'>Konular yükleniyor...</p>";

            const currentUser = auth.currentUser;

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p class='no-posts'>Henüz hiç konu açılmamış. İlk konuyu sen başlat!</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    
                    let actionButtonsHtml = '';
                    const isOwner = currentUser && post.userId === currentUser.uid;

                    if (isRootUser || isOwner) {
                        const safeTitle = escapeHtml(post.title).replace(/'/g, "\\'");
                        const safeContent = escapeHtml(post.content).replace(/'/g, "\\'");
                        
                        const editBtn = `<button class="action-btn" onclick="editPost('${postId}', '${safeTitle}', '${safeContent}')" title="Düzenle">${PENCIL_SVG}</button>`;
                        const deleteBtn = (isRootUser || !currentUser.isAnonymous) 
                            ? `<button class="action-btn delete-btn" onclick="deletePost('${postId}')" title="Sil">${TRASH_SVG}</button>` 
                            : '';

                        actionButtonsHtml = `
                            <div class="post-actions">
                                ${editBtn}
                                ${deleteBtn}
                            </div>
                        `;
                    }

                    const postElement = document.createElement('div');
                    postElement.className = 'post-card';
                    postElement.innerHTML = `
                        ${actionButtonsHtml}
                        <h3 style="padding-right: 65px;">${escapeHtml(post.title)}</h3>
                        <p>${escapeHtml(post.content)}</p>
                        <div class="post-meta">Yayınlayan: <strong>${escapeHtml(post.author || 'Anonim')}</strong></div>
                    `;
                    container.appendChild(postElement);
                });
            } catch (error) {
                console.error("Konular yüklenemedi:", error);
                container.innerHTML = "<p class='no-posts'>Konular yüklenirken hata oluştu veya veritabanı henüz boş.</p>";
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
