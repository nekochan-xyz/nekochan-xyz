<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misafir Girişi - XForum</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../" class="logo">XForum</a>
    <a href="../" class="btn btn-secondary">Ana Sayfa</a>
  </header>

  <div class="container" style="max-width:420px; margin-top:40px;">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px;">Anonim Misafir Girişi</h2>
      <p style="color:#8b949e; font-size:0.9rem; margin-bottom:20px;">
        Kayıt olmadan geçici bir misafir hesabıyla foruma katılabilir ve konu paylaşabilirsiniz.
      </p>

      <div id="errorBox" class="error-msg hidden"></div>
      <button id="guestBtn" class="btn btn-primary" style="width:100%;">Anonim Olarak Devam Et</button>

      <div style="margin-top:16px; font-size:0.9rem; color:#8b949e;">
        Kalıcı hesap için <a href="../register/" style="color:#58a6ff; text-decoration:none;">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "../firebase-config.js";
    import { signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    document.getElementById("guestBtn").addEventListener("click", async () => {
      const btn = document.getElementById("guestBtn");
      const errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");

      btn.disabled = true;
      btn.innerText = "Bağlanılıyor...";

      try {
        await signInAnonymously(auth);
        window.location.href = "../";
      } catch (err) {
        errorBox.innerText = "Anonim giriş başarısız: " + err.message;
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.innerText = "Anonim Olarak Devam Et";
      }
    });
  </script>
</body>
</html>
