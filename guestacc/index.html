<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misafir Girişi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        button { width: 100%; padding: 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #5a6268; }
        .error { color: red; font-size: 14px; margin-top: 10px; }
        .link { margin-top: 15px; font-size: 14px; }
        .link a { color: #007BFF; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Misafir Olarak Giriş Yap</h2>
        <p>Hesap oluşturmadan hızlıca sistemi test etmek veya göz atmak için misafir girişini kullanabilirsiniz.</p>
        <button id="guestBtn">Misafir Girişi Yap</button>
        <p id="errorMsg" class="error"></p>
        <div class="link">
            <a href="../login/index.html">Normal Giriş Yap</a>
        </div>
    </div>

    <script type="module">
        import { auth } from '../firebase-config.js';
        import { signInAnonymously } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

        const guestBtn = document.getElementById('guestBtn');
        const errorMsg = document.getElementById('errorMsg');

        guestBtn.addEventListener('click', async () => {
            errorMsg.textContent = "";
            try {
                await signInAnonymously(auth);
                alert("Misafir olarak başarıyla giriş yapıldı!");
                // Misafir girişinden sonra yönlendirilecek sayfa
                window.location.href = "../webhome/index.html";
            } catch (error) {
                errorMsg.textContent = "Hata: " + error.message;
            }
        });
    </script>
</body>
</html>
