<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misafir Girişi - XForum</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .guest-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="guest-card">
    <h2 style="margin-bottom:10px; color: #38bdf8;">Anonim Misafir Girişi</h2>
    <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:20px;">
      Kayıt olmadan geçici bir misafir hesabıyla foruma katılabilir ve konu paylaşabilirsiniz.
    </p>

    <div id="errorBox" class="error" style="margin-bottom: 10px;"></div>
    <button id="guestBtn" class="btn btn-primary" style="width:100%; padding: 12px;">Anonim Olarak Devam Et</button>

    <div style="margin-top:16px; font-size:0.9rem; color:#94a3b8;">
      Kalıcı hesap için <a href="../register/index.html" style="color:#38bdf8; text-decoration:none;">Kayıt Ol</a>
    </div>
    <div style="margin-top:10px; font-size:0.9rem;">
      <a href="../index.html" style="color:#94a3b8; text-decoration:none;">← Ana Sayfaya Dön</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "../firebase-config.js";
    import { signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    document.getElementById("guestBtn").addEventListener("click", async () => {
      const btn = document.getElementById("guestBtn");
      const errorBox = document.getElementById("errorBox");
      errorBox.innerText = "";

      btn.disabled = true;
      btn.innerText = "Bağlanılıyor...";

      try {
        await signInAnonymously(auth);
        window.location.href = "../index.html";
      } catch (err) {
        errorBox.innerText = "Anonim giriş başarısız: " + err.message;
        btn.disabled = false;
        btn.innerText = "Anonim Olarak Devam Et";
      }
    });
  </script>
</body>
</html>
