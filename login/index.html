<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Xforum</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #475569; background: #0f172a; color: #f8fafc; border-radius: 8px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0369a1; }
        .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .link a { color: #38bdf8; text-decoration: none; }
        .back-home { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-home:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Giriş Yap</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit" id="submitBtn">Giriş Yap</button>
            <p id="errorMsg" class="error"></p>
        </form>
        <div class="link">
            Hesabın yok mu? <a href="../register/index.html">Kayıt Ol</a>
        </div>
        <a href="../index.html" class="back-home">← Ana Sayfaya Dön</a>
    </div>

    <!-- Firebase ve Giriş Mantığı (10.12.2 Uyumlu) -->
    <script type="module">
        import { auth } from '../firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Kayıt sayfasından yönlendirildiyse bilgileri otomatik doldur
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('username')) {
            document.getElementById('username').value = urlParams.get('username');
        }
        if (urlParams.has('password')) {
            document.getElementById('password').value = urlParams.get('password');
        }

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            errorMsg.textContent = "";

            const syntheticEmail = usernameInput.toLowerCase() + "@xforum.local";

            submitBtn.disabled = true;
            submitBtn.textContent = "Giriş Yapılıyor...";

            try {
                await signInWithEmailAndPassword(auth, syntheticEmail, password);
                window.location.href = "../index.html"; 
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.textContent = "Giriş Yap";
                errorMsg.textContent = "Giriş başarısız: Kullanıcı adı veya şifre hatalı.";
            }
        });
    </script>
</body>
</html>
