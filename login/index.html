<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - XForum</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../" class="logo">XForum</a>
    <a href="../" class="btn btn-secondary">Ana Sayfa</a>
  </header>

  <div class="container" style="max-width:420px; margin-top:40px;">
    <div class="card">
      <h2 style="margin-bottom:18px; text-align:center;">Giriş Yap</h2>
      <div id="errorBox" class="error-msg hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Kullanıcı Adı</label>
          <input type="text" id="username" placeholder="Kullanıcı adınız" required>
        </div>

        <div class="form-group">
          <label>Şifre</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Şifreniz" required>
            <button type="button" class="toggle-pw" id="togglePw">Göster</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;">Giriş Yap</button>
      </form>

      <div style="margin-top:16px; text-align:center; font-size:0.9rem; color:#8b949e;">
        Hesabın yok mu? <a href="../register/" style="color:#58a6ff; text-decoration:none;">Kayıt Ol</a> • 
        <a href="../guestacc/" style="color:#58a6ff; text-decoration:none;">Misafir Girişi</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "../firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const pwInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePw");
    toggleBtn.addEventListener("click", () => {
      const isPassword = pwInput.type === "password";
      pwInput.type = isPassword ? "text" : "password";
      toggleBtn.innerText = isPassword ? "Gizle" : "Göster";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");

      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = pwInput.value;
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Giriş yapılıyor...";

      try {
        await signInWithEmailAndPassword(auth, username + "@xforum.local", password);
        window.location.href = "../";
      } catch (err) {
        errorBox.innerText = "Kullanıcı adı veya şifre hatalı.";
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.innerText = "Giriş Yap";
      }
    });
  </script>
</body>
</html>
