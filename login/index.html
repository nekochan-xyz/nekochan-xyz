<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #007BFF; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Giriş Yap</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-posta Adresi" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
            <p id="errorMsg" class="error"></p>
        </form>
        <div class="link">
            Hesabın yok mu? <a href="../register/index.html">Kayıt Ol</a>
        </div>
    </div>

    <script type="module">
        import { auth } from '../firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorMsg.textContent = "";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Giriş başarılı!");
                // Giriş yapıldıktan sonra yönlendirilecek ana sayfa (İhtiyacınıza göre değiştirebilirsiniz)
                window.location.href = "../webhome/index.html"; 
            } catch (error) {
                errorMsg.textContent = "Giriş başarısız: E-posta veya şifre hatalı.";
            }
        });
    </script>
</body>
</html>
