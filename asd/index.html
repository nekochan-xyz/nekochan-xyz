<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Kontrol - Xforum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 20px;
        }
        .section {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .section h3 {
            font-size: 15px;
            color: #e2e8f0;
            margin: 0 0 5px 0;
        }
        .user-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .user-meta {
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
        }
        .user-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn {
            padding: 7px 12px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }
        .btn-blue { background: #0284c7; }
        .btn-blue:hover { background: #0369a1; }
        .btn-red { background: #dc2626; }
        .btn-red:hover { background: #b91c1c; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        .btn-gray { background: #475569; }
        .btn-gray:hover { background: #64748b; }
        .root-badge {
            background: #dc2626;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .banned-badge {
            background: #991b1b;
            color: #fecaca;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #ef4444;
        }
        .back-home {
            display: block;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            margin-top: 5px;
        }
        .back-home:hover { color: #f8fafc; }
        .loading, .empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
            font-size: 14px;
        }
        .info-text {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Root Kontrol</h2>

        <div class="section">
            <h3>Kayıtlı Üyeler</h3>
            <p class="info-text">Kullanıcı adı değiştirme, banlama ve hesap silme işlemlerini buradan yapabilirsiniz.</p>
            <div id="usersContainer">
                <p class="loading">Üyeler yükleniyor...</p>
            </div>
        </div>

        <a href="../index.html" class="back-home">← Ana Sayfaya Dön</a>
    </div>

    <script type="module">
        import { auth, db } from '../firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const ROOT_UID = "toemJGBIU9XH7RWZ90SQqjWk0AH3";

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.uid !== ROOT_UID) {
                alert("Bu alana sadece Root hesabı erişebilir.");
                window.location.href = "../index.html";
                return;
            }
            loadUsers();
        });

        window.editUsername = async (userId, currentUsername) => {
            if (userId === ROOT_UID) {
                alert("Kendi adınızı Hesap Ayarları'ndan değiştirebilirsiniz.");
                return;
            }
            const newUsername = prompt("Yeni kullanıcı adı:", currentUsername);
            if (newUsername === null) return;
            const trimmed = newUsername.trim();
            if (!trimmed) {
                alert("Kullanıcı adı boş olamaz!");
                return;
            }
            try {
                await updateDoc(doc(db, "users", userId), { username: trimmed });
                alert("Kullanıcı adı güncellendi.");
                loadUsers();
            } catch (error) {
                alert("Hata: " + error.message);
            }
        };

        window.toggleBan = async (userId, username, isBanned) => {
            if (userId === ROOT_UID) {
                alert("Root hesabını banlayamazsın!");
                return;
            }
            const text = isBanned ? "banını kaldırmak" : "banlamak";
            if (!confirm(`"${username}" kullanıcısını ${text} istediğinize emin misiniz?`)) return;
            try {
                await updateDoc(doc(db, "users", userId), { banned: !isBanned });
                loadUsers();
            } catch (error) {
                alert("Hata: " + error.message);
            }
        };

        window.deleteUserAccount = async (userId, username) => {
            if (userId === ROOT_UID) {
                alert("Root hesabını silemezsin!");
                return;
            }
            if (!confirm(`"${username}" hesabını KALICI olarak silmek istediğinize emin misiniz?\nBu işlem geri alınamaz!`)) return;
            if (!confirm("Son kez onaylıyor musunuz? Hesap tamamen silinecek.")) return;

            try {
                // Önce Firestore kaydını sil
                await deleteDoc(doc(db, "users", userId));
                alert(`"${username}" hesabı silindi.\nNot: Auth tarafındaki hesap Firebase Console'dan manuel silinmelidir.`);
                loadUsers();
            } catch (error) {
                alert("Hata: " + error.message);
            }
        };

        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<p class="loading">Üyeler yükleniyor...</p>';

            try {
                const snap = await getDocs(collection(db, "users"));
                container.innerHTML = "";

                if (snap.empty) {
                    container.innerHTML = '<p class="empty">Henüz kayıtlı üye yok.</p>';
                    return;
                }

                snap.forEach((docSnap) => {
                    const data = docSnap.data();
                    const uid = docSnap.id;
                    const username = data.username || "İsimsiz";
                    const email = data.email || "-";
                    const isBanned = data.banned === true;
                    const isRoot = uid === ROOT_UID;
                    const safeName = escapeHtml(username).replace(/'/g, "\\'");

                    const badges = `
                        ${isRoot ? '<span class="root-badge">ROOT</span>' : ''}
                        ${isBanned ? '<span class="banned-badge">BANLI</span>' : ''}
                    `;

                    let buttons = '';
                    if (!isRoot) {
                        buttons = `
                            <div class="user-actions">
                                <button class="btn btn-blue" onclick="editUsername('${uid}', '${safeName}')">Ad Değiştir</button>
                                <button class="btn ${isBanned ? 'btn-green' : 'btn-gray'}" onclick="toggleBan('${uid}', '${safeName}', ${isBanned})">
                                    ${isBanned ? 'Banı Kaldır' : 'Banla'}
                                </button>
                                <button class="btn btn-red" onclick="deleteUserAccount('${uid}', '${safeName}')">Hesabı Sil</button>
                            </div>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <div class="user-header">
                            <div class="user-name">${escapeHtml(username)} ${badges}</div>
                        </div>
                        <div class="user-meta">E-posta: ${escapeHtml(email)}</div>
                        <div class="user-meta">UID: ${uid}</div>
                        ${buttons}
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="empty">Üyeler yüklenemedi.</p>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
