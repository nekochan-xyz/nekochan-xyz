<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Xforum</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #475569; background: #0f172a; color: #f8fafc; border-radius: 8px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #15803d; }
        .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .link a { color: #38bdf8; text-decoration: none; }
        .back-home { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-home:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kayıt Ol</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre (En az 6 karakter)" required>
            <button type="submit" id="submitBtn">Kayıt Ol</button>
            <p id="errorMsg" class="error"></p>
        </form>
        <div class="link">
            Zaten hesabın var mı? <a href="../login/index.html">Giriş Yap</a>
        </div>
        <a href="../index.html" class="back-home">← Ana Sayfaya Dön</a>
    </div>

    <script type="module">
        import { auth, db } from '../firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            errorMsg.textContent = "";

            // Kullanıcı adı karakter kontrolü
            const validRegex = /^[a-zA-Z0-9çğıöşüÇĞİÖŞÜ_\-\.]+$/;
            if (!validRegex.test(usernameInput)) {
                errorMsg.textContent = "Kullanıcı adında boşluk, @ ve özel karakterler kullanılamaz!";
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = "Şifre en az 6 karakter olmalıdır.";
                return;
            }

            const syntheticEmail = usernameInput.toLowerCase() + "@xforum.local";

            submitBtn.disabled = true;
            submitBtn.textContent = "Kayıt Yapılıyor...";

            try {
                // 1. Firebase Auth ile hesap oluştur (kullanıcı otomatik giriş yapmış olur)
                const userCredential = await createUserWithEmailAndPassword(auth, syntheticEmail, password);
                const user = userCredential.user;

                // 2. Firestore'a kullanıcı bilgilerini kaydet
                try {
                    await setDoc(doc(db, "users", user.uid), {
                        username: usernameInput,
                        email: syntheticEmail,
                        createdAt: new Date().toISOString(),
                        banned: false
                    });
                } catch (firestoreErr) {
                    console.warn("Firestore yazma uyarısı:", firestoreErr);
                }

                // 3. Şifre URL'ye konmadan direkt ana sayfaya yönlendir
                window.location.href = "../index.html";
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.textContent = "Kayıt Ol";
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg.textContent = "Bu kullanıcı adı zaten alınmış.";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg.textContent = "Şifre en az 6 karakter olmalıdır.";
                } else {
                    errorMsg.textContent = "Hata: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
