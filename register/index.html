<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="auth-container">
        <div class="box">
            <h2 style="margin-bottom: 1rem;">Kayıt Ol</h2>
            <div id="errorMsg" class="error-msg"></div>
            <input type="text" id="username" placeholder="Kullanıcı adınız (sadece harf/rakam)">
            <input type="password" id="password" placeholder="Şifreniz (en az 6 karakter)">
            <button id="registerBtn" style="width: 100%; margin-bottom: 1rem;">Hesap Oluştur</button>
            <div style="display: flex; justify-content: space-between;">
                <a href="../login/" class="link-text">Zaten hesabım var</a>
                <a href="../" class="link-text">Ana Sayfa</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from '../firebase-config.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = '';

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                errorMsg.innerText = 'Kullanıcı adı 3-20 karakter olmalı ve sadece harf, rakam veya _ içermelidir.';
                return;
            }
            if (password.length < 6) {
                errorMsg.innerText = 'Şifre en az 6 karakter olmalıdır.';
                return;
            }

            try {
                // Kullanıcı adını arka planda sanal e-posta formatına çeviriyoruz
                const fakeEmail = `${username.toLowerCase()}@xforum.local`;
                const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
                await updateProfile(userCredential.user, { displayName: username });
                window.location.href = '../';
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg.innerText = 'Bu kullanıcı adı zaten alınmış.';
                } else {
                    errorMsg.innerText = 'Hata: ' + error.message;
                }
            }
        });
    </script>
</body>
</html>
