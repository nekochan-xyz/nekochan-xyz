<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - XForum</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../" class="logo">XForum</a>
    <a href="../" class="btn btn-secondary">Ana Sayfa</a>
  </header>

  <div class="container" style="max-width:420px; margin-top:40px;">
    <div class="card">
      <h2 style="margin-bottom:18px; text-align:center;">Hesap Oluştur</h2>
      <div id="errorBox" class="error-msg hidden"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Kullanıcı Adı (Harf, rakam, _ , - , .)</label>
          <input type="text" id="username" placeholder="orn: kadir_dev.01" required minlength="3" maxlength="25">
        </div>

        <div class="form-group">
          <label>Şifre (En az 8 karakter)</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="En az 8 karakter" required minlength="8">
            <button type="button" class="toggle-pw" id="togglePw">Göster</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;">Kayıt Ol</button>
      </form>

      <div style="margin-top:16px; text-align:center; font-size:0.9rem; color:#8b949e;">
        Zaten hesabın var mı? <a href="../login/" style="color:#58a6ff; text-decoration:none;">Giriş Yap</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "../firebase-config.js";
    import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Şifre göster/gizle
    const pwInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePw");
    toggleBtn.addEventListener("click", () => {
      const isPassword = pwInput.type === "password";
      pwInput.type = isPassword ? "text" : "password";
      toggleBtn.innerText = isPassword ? "Gizle" : "Göster";
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");

      const username = document.getElementById("username").value.trim();
      const password = pwInput.value;

      // Kullanıcı adı kontrolü: sadece harf, rakam, _, -, .
      const validUsername = /^[a-zA-Z0-9._-]+$/;
      if (!validUsername.test(username)) {
        errorBox.innerText = "Kullanıcı adı sadece harf, rakam ve (_, -, .) karakterlerini içerebilir.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (password.length < 8) {
        errorBox.innerText = "Şifreniz en az 8 karakter olmalıdır.";
        errorBox.classList.remove("hidden");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Kaydediliyor...";

      try {
        const fakeEmail = username.toLowerCase() + "@xforum.local";
        const userCred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
        await updateProfile(userCred.user, { displayName: username });
        window.location.href = "../";
      } catch (err) {
        if (err.code === "auth/email-already-in-use") {
          errorBox.innerText = "Bu kullanıcı adı zaten alınmış.";
        } else {
          errorBox.innerText = "Kayıt hatası: " + err.message;
        }
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.innerText = "Kayıt Ol";
      }
    });
  </script>
</body>
</html>
